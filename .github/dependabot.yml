# 每月自動檢查套件更新並開 PR；CI 通過（綠燈）就可以合併
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/apps/lab-interview', '/apps/ink-sort-puzzle']
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    ignore:
      # @astrojs/check 目前只支援 TypeScript 5 或 6，升到 7 會讓 npm ci 失敗
      # 等 @astrojs/check 支援 TypeScript 7 之後再刪掉這段
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
